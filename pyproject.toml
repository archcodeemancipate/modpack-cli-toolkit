[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "modpack-cli-toolkit"
version = "0.9.4"
description = "Build, sign, diff, and ship game mod packages from a manifest. Layered CLI for mod authors and pack maintainers."
readme = "docs/CLI_REFERENCE.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "modpack-cli-toolkit contributors" }]
keywords = ["modding", "modpack", "cli", "packaging", "game-mods", "manifest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Games/Entertainment",
]

dependencies = [
    "click>=8.1.7",
    "rich>=13.7.1",
    "pydantic>=2.7.0",
    "tomli-w>=1.0.0",
    "blake3>=0.4.1",
    "zstandard>=0.22.0",
    "py7zr>=0.21.0",
]

[project.optional-dependencies]
signing = ["cryptography>=42.0.5"]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
]

[project.scripts]
modpack = "modpack_cli.bootstrap.cli:main"
mpk = "modpack_cli.bootstrap.cli:main"

[project.urls]
Homepage = "https://github.com/modpack-cli-toolkit/modpack-cli-toolkit"
Issues = "https://github.com/modpack-cli-toolkit/modpack-cli-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/modpack_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["modpack_cli"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=modpack_cli --cov-report=term-missing"